appId: ${HCM_APP_ID}
name: "Onboarding - health facility stock user's boundary data download"
tags:
  - regression
  - onboarding
  - hf-stock
  - mhbase
---
# Prompt 17 for the health facility: after the facility is chosen and
# submitted, the app checks the server for the boundary's records and answers
# "Data found!", "No data found!" or "Failed to check data in server"; each
# answer is handled (subflows/home/boundary-data.yaml) and the run ends on
# home. Which answer comes is the server's to decide, so a run covers the test
# cases of the answer it got and logs which. Downloading copies records to
# the device and changes nothing on the server.
#
# Needs HCM_HF_STOCK_USER_ID / HCM_HF_STOCK_PASSWORD (AU-HFS-001 on the
# mhbase tenant); BOUNDARY_DATA_CHOICE (Download or Proceed) and
# BOUNDARY_DATA_RETRIES are optional.

# Sign in, Allow Permissions, the first facility, Submit, the data check,
# home - with the Manage Stock card.
- runFlow: ../../subflows/home/hf-stock.yaml

# Test Case 7 - the health facility's home.
- assertVisible:
    text: "Stock Balance"
    label: "Test Case 7 - Stock Balance on home"
- assertVisible:
    text: "Manage Stock"
    label: "Test Case 7 - Manage Stock on home"
- assertVisible:
    text: "Download Stock Data"
    label: "Test Case 7 - Download Stock Data on home"
- takeScreenshot: artifacts/boundary-data-hf-home
- evalScript: "${console.log('Prompt 17 PASSED for the Health Facility User - ' + output.bd.detail + '; home shows Stock Balance, Manage Stock and Download Stock Data. Covered: ' + output.bd.covered)}"
