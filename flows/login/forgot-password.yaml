appId: ${HCM_APP_ID}
name: "Login - forgot password shows contact message"
tags:
  - regression
  - login
---
# There is no self-service reset: the link only opens a dialog pointing the
# user at their administrator. Hits no backend.
- runFlow: ../../subflows/launch-app.yaml

- tapOn:
    text: "Forgot Password.*"
    label: "Open Forgot Password"

# The dialog title "Forgot Password" sits on a full-screen container, so it
# proves little. The body message is the distinctive part.
- assertVisible:
    text: "Please contact your administrator if you have forgotten your password"
    label: "Contact-administrator message is shown"

- takeScreenshot: artifacts/forgot-password-dialog

- tapOn:
    text: "Ok"
    label: "Dismiss the dialog"

- assertNotVisible:
    text: "Please contact your administrator.*"
    label: "Dialog is closed"
- assertVisible:
    text: "User ID.*"
    label: "Back on the login screen"
