appId: ${HCM_APP_ID}
name: NB5 part 2 - same screen, Near by still on, type the name
tags:
  - proximity
---
# After part 1 and the list recording: scroll back to the top, type NAME with
# Near by still on, and check the new household (head aged HEAD_AGE) shows.
- repeat:
    times: 8
    commands:
      - swipe:
          start: "97%,30%"
          end: "97%,85%"
          duration: 300
- runFlow:
    file: ../../../beneficiary-id/subflows/registration/search-field.yaml
    env:
      TEXT: ${NAME}
- extendedWaitUntil:
    visible:
      text: "Open"
      below: "Search by ID"
    timeout: 20000
    optional: true
    label: "NAME shows"
- runFlow:
    file: ../../subflows/is-listed.yaml
    env:
      AGE: ${HEAD_AGE}
- evalScript: "${console.log((output.listed ? 'CHECK|PASS|' : 'CHECK|FAIL|') + NAME + ' ' + ID_LAST_NAME + ' found with Near by on and the name typed')}"
- takeScreenshot: artifacts/nb5-nearby-name
