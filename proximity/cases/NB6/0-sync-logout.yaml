appId: ${HCM_APP_ID}
name: NB6 part 0 - sync everything, then log out
tags:
  - proximity
---
# Before the app's storage is cleared (QA's clean-start case, 2026-11-06):
# nothing may be left unsynced, and the server session must end - the AZM
# Kaduna UAT refused a second session (ID-fix README, question 10), so a
# session left open by a wiped app could block the next login.
- runFlow:
    when:
      notVisible: "Registration & Delivery|Stock Balance"
    file: ../../../beneficiary-id/subflows/common/go-home.yaml
- runFlow: ../../../beneficiary-id/subflows/common/sync-data.yaml
- runFlow: ../../../beneficiary-id/subflows/common/logout.yaml
