appId: ${HCM_APP_ID}
name: X1 part 3 - Add Member M to H1 (X2 - the success screen's ID)
tags:
  - phase-a
  - phase-b
---
# X1 part 3 (see 1-start.yaml), on H1's Household Overview: Add Members ->
# QAID-X1-M-<run> -> the success screen (its Token ID) -> View Household
# Details (the card's ID). Ends on the home screen.
#
# M is 30 months old: on Household Overview a member is told apart by age
# (every name reads "--"), and H1 may hold members from earlier X1 runs at
# the default ID_MEMBER_AGE_MONTHS (read-member-card.yaml finds M by its
# Token ID first, by age only when that fails).
- extendedWaitUntil:
    visible: "Household Overview|Edit Individual"
    timeout: 15000
    label: "Part 2 left the app on H1's Household Overview"
- runFlow:
    file: ../../subflows/registration/add-member-and-read.yaml
    env:
      NAME: "QAID-X1-M-${QAID_RUN}"
      HOUSEHOLD: QAID-FIX-E1
      KEY: X1_ID_M
      AGE_MONTHS: "30"
- runScript:
    file: ../../subflows/id/id.js
    env:
      CASE: X2
      ACTION: check
      OK: ${String(output.id.ack) == String(output.id.last)}
      TEXT: "${'The success screen shows the ID saved on the card - Token ID ' + output.id.ack + ', card ' + output.id.last}"
- runFlow: ../../subflows/common/go-home.yaml
