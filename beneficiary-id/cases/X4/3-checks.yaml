appId: ${HCM_APP_ID}
name: X4 part 3 - the ID check
tags:
  - phase-a
---
# X4 part 3 (see 1-start.yaml), from the home screen.
- extendedWaitUntil:
    visible: "Registration & Delivery|Stock Balance"
    timeout: 15000
    label: "Part 2 left the app on the home screen"
- runFlow: ../../subflows/id/read-available.yaml
- evalScript: ${output.n1 = output.id.available}
- runScript:
    file: ../../subflows/id/id.js
    env:
      ACTION: check
      OK: ${Number(N0) - output.n1 == 1}
      TEXT: "${'N available unchanged by the consent-No household - ' + N0 + ' to ' + output.n1 + ' after A (consent No) and B (expected -1, for B only)'}"
- runScript:
    file: ../../subflows/id/id.js
    env:
      ACTION: check
      OK: ${String(X4_ID_B).length == 12 && !/\D/.test(X4_ID_B)}
      TEXT: "${'B has a 12-digit ID - ' + X4_ID_B}"
- runFlow:
    file: ../../subflows/id/search-by-id.yaml
    env:
      ID: ${X4_ID_B}
      HEAD: "QAID-X4-B-${QAID_RUN} ${ID_LAST_NAME}"
      HEAD_ID: ${X4_ID_B}
- runFlow:
    when:
      true: ${output.id.failed}
    file: ../../subflows/common/fail.yaml
    env:
      MESSAGE: "${'X4 failed - ' + output.id.failed}"
