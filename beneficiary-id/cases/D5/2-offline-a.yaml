appId: ${HCM_APP_ID}
name: D5 part 2 - device 1 offline, registers A
tags:
  - phase-a
---
# D5 part 2 (see 1-start.yaml), device 1, from the home screen, while
# device 2 registers B: airplane mode on -> QAID-D5-A -> N available. Ends on
# the home screen, still offline.
- extendedWaitUntil:
    visible: "Registration & Delivery|Stock Balance"
    timeout: 15000
    label: "Part 1 left device 1 on the home screen"
- setAirplaneMode: enabled
- runFlow: ../../subflows/registration/open-search.yaml
- runFlow:
    file: ../../subflows/registration/register-and-read.yaml
    env:
      NAME: "QAID-D5-A-${QAID_RUN}"
      KEY: D5_ID_A
- runFlow: ../../subflows/common/go-home.yaml
- runFlow: ../../subflows/id/read-available.yaml
- runScript:
    file: ../../subflows/id/id.js
    env:
      ACTION: note
      TEXT: "${'Device 1 N available ' + N0 + ' before A, ' + output.id.available + ' after'}"
