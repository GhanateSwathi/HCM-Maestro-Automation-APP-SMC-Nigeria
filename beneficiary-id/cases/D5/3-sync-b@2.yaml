appId: ${HCM_APP_ID}
name: D5 part 3 - device 2 back online, Sync Data
tags:
  - phase-a
---
# D5 part 3 (see 1-start.yaml), device 2, from the home screen, at the same
# time as device 1 syncs A. Ends on the home screen with B synced.
- extendedWaitUntil:
    visible: "Registration & Delivery|Stock Balance"
    timeout: 15000
    label: "Part 2 left device 2 on the home screen"
- setAirplaneMode: disabled
- extendedWaitUntil:
    visible: "Never shown - a pause while the network comes back"
    timeout: 8000
    optional: true
- runFlow: ../../subflows/common/sync-data.yaml
- runScript:
    file: ../../subflows/id/id.js
    env:
      ACTION: note
      TEXT: "${'Device 2 synced B at the same time as device 1 synced A - the server accepted B' + (String(D5_ID_A) == String(D5_ID_B) ? ' with the same ID as A: the duplicate is on the server' : '')}"
