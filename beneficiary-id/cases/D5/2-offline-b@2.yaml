appId: ${HCM_APP_ID}
name: D5 part 2 - device 2 offline, registers B
tags:
  - phase-a
---
# D5 part 2 (see 1-start.yaml), device 2, from the home screen, while
# device 1 registers A: airplane mode on -> QAID-D5-B -> N available. Ends on
# the home screen, still offline.
- extendedWaitUntil:
    visible: "Registration & Delivery|Stock Balance"
    timeout: 15000
    label: "Part 1 left device 2 on the home screen"
- setAirplaneMode: enabled
- runFlow: ../../subflows/registration/open-search.yaml
- runFlow:
    file: ../../subflows/registration/register-and-read.yaml
    env:
      NAME: "QAID-D5-B-${QAID_RUN}"
      KEY: D5_ID_B
- runFlow: ../../subflows/common/go-home.yaml
- runFlow: ../../subflows/id/read-available.yaml
- runScript:
    file: ../../subflows/id/id.js
    env:
      ACTION: note
      TEXT: "${'Device 2 N available ' + N0_2 + ' before B, ' + output.id.available + ' after'}"
