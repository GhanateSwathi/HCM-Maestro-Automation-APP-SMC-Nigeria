appId: ${HCM_APP_ID}
name: X9 part 1 - device 1 signs in and downloads IDs
tags:
  - phase-a
---
# Test plan X9 - same CDD, two devices, synced - run in lockstep (QA's
# decision, 2026-11-03): both emulators do each step at the same time, signed
# in as the same CDD. Parts with the same number run together
# (run-case.ps1); parts "@2" run on device 2 (DEVICE_ID_2).
#   1  both sign in and download IDs (Re-Fetch IDs on "Limit exceeded").
#      "Download" is a try: on Kebbi 2.2.122 the button is greyed out while
#      the device holds 600 of 600 (2026-11-03 19:17), and then the device
#      goes on with the IDs it holds (a NOTE says so)
#   2  device 1 registers QAID-X9-A, device 2 QAID-X9-B, both online
#   3  both Sync Data
#   4  the ID checks, each device on its own ID
# The plan's order - device 1 syncs A before device 2 downloads - is not
# kept: both devices hold their IDs before either registers. D5 is the same
# with both devices offline.
#
# Expected: A != B; N available on each device drops by exactly 1; no ID
# already in the ledger (report.py). The plan's server search of both IDs is
# not done (no server access).
#
# Two identical emulators (scripts/start-emulator.ps1, HCM_Beneficiary_ID and
# HCM_Beneficiary_ID_2). VARs: N0, N0_2, X9_ID_A, X9_ID_B. Writes two
# households to UAT.
- runFlow:
    file: ../../subflows/id/case-start.yaml
    env:
      NEED: 1
      DOWNLOAD: "try"
