appId: ${HCM_APP_ID}
name: X9 part 2 - device 2 registers B
tags:
  - phase-a
---
# X9 part 2 (see 1-start.yaml), device 2, from the home screen, online, while
# device 1 registers A. Ends on the home screen, B not yet synced.
- extendedWaitUntil:
    visible: "Registration & Delivery|Stock Balance"
    timeout: 15000
    label: "Part 1 left device 2 on the home screen"
- runFlow: ../../subflows/registration/open-search.yaml
- runFlow:
    file: ../../subflows/registration/register-and-read.yaml
    env:
      NAME: "QAID-X9-B-${QAID_RUN}"
      KEY: X9_ID_B
- runFlow: ../../subflows/common/go-home.yaml
- runFlow: ../../subflows/id/read-available.yaml
- runScript:
    file: ../../subflows/id/id.js
    env:
      ACTION: check
      OK: ${Number(N0_2) - output.id.available == 1}
      TEXT: "${'Device 2 N available drops by exactly 1 for B - ' + N0_2 + ' to ' + output.id.available}"
