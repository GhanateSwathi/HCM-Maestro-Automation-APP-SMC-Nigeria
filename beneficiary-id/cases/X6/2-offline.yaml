appId: ${HCM_APP_ID}
name: X6 part 2 - airplane mode, A, A1, B
tags:
  - phase-a
---
# X6 part 2 (see 1-start.yaml), from the home screen. Ends on the home
# screen, still in airplane mode.
- extendedWaitUntil:
    visible: "Registration & Delivery|Stock Balance"
    timeout: 15000
    label: "Part 1 left the app on the home screen"
- setAirplaneMode: enabled
- runFlow: ../../subflows/registration/open-search.yaml
- runFlow:
    file: ../../subflows/registration/register-and-read.yaml
    env:
      NAME: "QAID-X6-A-${QAID_RUN}"
      KEY: X6_ID_A
- runFlow:
    file: ../../subflows/registration/add-member-and-read.yaml
    env:
      NAME: "QAID-X6-A1-${QAID_RUN}"
      HOUSEHOLD: "QAID-X6-A-${QAID_RUN}"
      KEY: X6_ID_A1
- runFlow: ../../subflows/registration/to-search.yaml
- runFlow:
    file: ../../subflows/registration/register-and-read.yaml
    env:
      NAME: "QAID-X6-B-${QAID_RUN}"
      KEY: X6_ID_B
- runFlow: ../../subflows/common/go-home.yaml
