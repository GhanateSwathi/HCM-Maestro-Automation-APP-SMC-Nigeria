appId: ${HCM_APP_ID}
name: P1 part 4 - the ID check for A and B
tags:
  - phase-a
  - phase-b
---
# P1 part 4 (see 1-start.yaml), from B's Household Overview: N available
# again, then the expected results. P1_N0, P1_ID_A and P1_ID_B come from
# parts 1-3.
- runFlow: ../../subflows/common/go-home.yaml
- runFlow: ../../subflows/id/read-available.yaml
- evalScript: ${output.n1 = output.id.available}
- runScript:
    file: ../../subflows/id/id.js
    env:
      ACTION: check
      # Neither "}" nor "$" inside a ${...}: it ends at its first "}", and
      # with a "$" in it (a regex's end anchor) Maestro does not evaluate it
      # at all - the raw text comes through and the check reads as failed
      # (P1 part 4, 2026-10-30 19:39 and 19:43). "12 characters, none of
      # them a non-digit" needs neither.
      OK: ${String(P1_ID_A).length == 12 && !/\D/.test(P1_ID_A) && String(P1_ID_B).length == 12 && !/\D/.test(P1_ID_B) && String(P1_ID_A) != String(P1_ID_B)}
      TEXT: "${'A and B have different 12-digit IDs - A ' + P1_ID_A + ', B ' + P1_ID_B}"
- runScript:
    file: ../../subflows/id/id.js
    env:
      ACTION: check
      OK: ${Number(P1_N0) - output.n1 == 2}
      TEXT: "${'N available drops by exactly 2 - ' + P1_N0 + ' to ' + output.n1 + ' (' + (output.n1 - Number(P1_N0)) + ')'}"
- runFlow:
    file: ../../subflows/id/search-by-id.yaml
    env:
      ID: ${P1_ID_A}
      HEAD: "QAID-P1-A-${QAID_RUN} ${ID_LAST_NAME}"
      HEAD_ID: ${P1_ID_A}
- runFlow:
    file: ../../subflows/id/search-by-id.yaml
    env:
      ID: ${P1_ID_B}
      HEAD: "QAID-P1-B-${QAID_RUN} ${ID_LAST_NAME}"
      HEAD_ID: ${P1_ID_B}
- runFlow:
    when:
      true: ${output.id.failed}
    file: ../../subflows/common/fail.yaml
    env:
      MESSAGE: "${'P1 failed - ' + output.id.failed}"
