appId: ${HCM_APP_ID}
name: P1b part 6 - Search by ID for 1A, 1B and 2A
tags:
  - phase-a
---
# P1b part 6 (see 1-start.yaml), from the home screen.
- extendedWaitUntil:
    visible: "Registration & Delivery|Stock Balance"
    timeout: 15000
    label: "Part 5 left the app on the home screen"
- runFlow:
    file: ../../subflows/id/search-by-id.yaml
    env:
      ID: ${P1B_ID_1A}
      HEAD: "QAID-P1b-1A-${QAID_RUN} ${ID_LAST_NAME}"
      HEAD_ID: ${P1B_ID_1A}
- runFlow:
    file: ../../subflows/id/search-by-id.yaml
    env:
      ID: ${P1B_ID_1B}
      HEAD: "QAID-P1b-1B-${QAID_RUN} ${ID_LAST_NAME}"
      HEAD_ID: ${P1B_ID_1B}
- runFlow:
    file: ../../subflows/id/search-by-id.yaml
    env:
      ID: ${P1B_ID_2A}
      HEAD: "QAID-P1b-2A-${QAID_RUN} ${ID_LAST_NAME}"
      HEAD_ID: ${P1B_ID_2A}
