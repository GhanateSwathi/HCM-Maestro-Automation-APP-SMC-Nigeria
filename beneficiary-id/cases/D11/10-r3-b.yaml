appId: ${HCM_APP_ID}
name: D11 part 10 - round 3, register B
tags:
  - phase-a
---
# D11 round 3 (see 01-start.yaml), from the home screen. Ends on the home
# screen.
- extendedWaitUntil:
    visible: "Registration & Delivery|Stock Balance"
    timeout: 15000
    label: "Part 09 left the app on the home screen"
- runFlow:
    file: ../../subflows/cases/d11-b.yaml
    env:
      R: 3
      N_AFTER: ${D11_N_AFTER_3}
      ID_A: ${D11_ID_3A}
