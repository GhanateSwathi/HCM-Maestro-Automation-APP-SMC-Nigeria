appId: ${HCM_APP_ID}
name: D11 part 05 - round 2, Submit A and kill the app
tags:
  - phase-a
---
# D11 round 2 (see 01-start.yaml), from the home screen. Ends with the app
# stopped.
- extendedWaitUntil:
    visible: "Registration & Delivery|Stock Balance"
    timeout: 15000
    label: "Part 04 left the app on the home screen"
- runFlow:
    file: ../../subflows/cases/d11-kill.yaml
    env:
      R: 2
