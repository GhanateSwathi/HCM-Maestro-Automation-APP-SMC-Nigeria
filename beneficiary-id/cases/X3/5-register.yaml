appId: ${HCM_APP_ID}
name: X3 part 5 - register QAID-X3-A for real
tags:
  - phase-a
---
# X3 part 5 (see 1-start.yaml), from the home screen. Ends on the home screen.
- extendedWaitUntil:
    visible: "Registration & Delivery|Stock Balance"
    timeout: 15000
    label: "Part 4 left the app on the home screen"
- runFlow: ../../subflows/registration/open-search.yaml
- runFlow:
    file: ../../subflows/registration/register-and-read.yaml
    env:
      NAME: "QAID-X3-A-${QAID_RUN}"
      KEY: X3_ID_A
- runFlow: ../../subflows/common/go-home.yaml
