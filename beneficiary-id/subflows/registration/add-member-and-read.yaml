appId: ${HCM_APP_ID}
name: id-add-member-and-read
---
# From Household Overview: add-member.yaml with NAME (aged AGE_MONTHS, when
# given), then View Household Details and the member's ID off their card
# (HOUSEHOLD names the household for the ledger). The card's ID goes to the
# later parts as VAR KEY, the success screen's as VAR <KEY>_ACK. Ends on
# Household Overview.
#
# id.js names a VAR by its NAME env, so the member's name is kept in
# output.member first and used from there.
- evalScript: ${output.member = NAME}
- runFlow:
    file: add-member.yaml
    env:
      NAME: ${output.member}
- runScript:
    file: ../id/id.js
    env:
      ACTION: var
      NAME: ${KEY + '_ACK'}
      VALUE: ${output.id.ack}
- tapOn:
    text: "View Household Details"
    label: "View Household Details"
- extendedWaitUntil:
    visible: "Household Overview|Edit Individual"
    timeout: 15000
    label: "Household Overview opens"
- runFlow:
    file: ../id/read-member-card.yaml
    env:
      PERSON: "${output.member} ${ID_LAST_NAME}"
      HOUSEHOLD: ${HOUSEHOLD}
      ACK: ${output.id.ack}
      AGE_MONTHS: "${typeof AGE_MONTHS == 'undefined' ? ID_MEMBER_AGE_MONTHS : AGE_MONTHS}"
      GENDER: ${ID_MEMBER_GENDER}
- runScript:
    file: ../id/id.js
    env:
      ACTION: var
      NAME: ${KEY}
      VALUE: ${output.id.last}
