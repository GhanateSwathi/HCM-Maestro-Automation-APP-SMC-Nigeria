appId: ${HCM_APP_ID}
name: sync-data
---
# Home, then Sync Data until "No Data available for sync" - every record the
# session made is on the server. Any role: the stock roles' and the CDD's
# home both show "Stock Balance". Ends on home.
#
# Every stock flow that submits ends with it (asked for 2026-10-27), so the
# next flow - or the next role's Download Stock Data - finds the records on
# the server instead of depending on the background Auto Sync;
# sync-and-logout.yaml starts with it.
#
# Read off the app as AU-SAT-001, 2026-10-23: Sync Data answers "No Data
# available for sync" when the background Auto Sync has already sent
# everything, else "Sync in progress" then "Data Synced Successfully"
# (Close); "Sync Up Failed" (for example "Session Expired") fails here - the
# next role would not see the records.

# --- Home -------------------------------------------------------------------------
- runFlow:
    when:
      visible:
        id: "android:id/input_method_nav_back"
    commands:
      - tapOn:
          id: "android:id/input_method_nav_back"
          label: "Close the keyboard"
- runFlow:
    when:
      notVisible: "Stock Balance"
    commands:
      - runFlow: open-side-menu.yaml
      - tapOn:
          text: "Home"
          above: "Logout"
          label: "Home"
- extendedWaitUntil:
    visible: "Stock Balance"
    timeout: 15000
    label: "On the home screen"

# --- Sync Data until nothing is left ------------------------------------------------
- evalScript: ${output.syncLog = ''}
- runFlow:
    when:
      visible: "There are .* yet to be synced\\.?"
    commands:
      - copyTextFrom:
          text: "There are .* yet to be synced\\.?"
          label: "Read the pending count"
      - evalScript: ${output.syncLog = maestro.copiedText + ' Then '}
- repeat:
    times: 4
    while:
      notVisible: "No Data available for sync"
    label: "Sync until nothing is left"
    commands:
      - extendedWaitUntil:
          notVisible: "Sync in progress"
          timeout: 180000
          optional: true
          label: "Any sync running finishes"
      - runFlow:
          when:
            visible: "Sync Up Failed.*"
          commands:
            - takeScreenshot: artifacts/sync-failed
            - runFlow:
                file: fail.yaml
                env:
                  MESSAGE: "Sync Data failed (Sync Up Failed) - this session's records are not on the server."
                label: "Sync Data succeeds"
      - runFlow:
          when:
            visible: "Data Synced Successfully"
          commands:
            - evalScript: ${output.syncLog = output.syncLog + 'Data Synced Successfully, then '}
            - tapOn: "Close"
      - runFlow:
          when:
            notVisible: "No Data available for sync"
          commands:
            - tapOn:
                text: "Sync Data"
                label: "Sync Data"
            - extendedWaitUntil:
                visible: "No Data available for sync|Sync in progress|Data Synced Successfully|Sync Up Failed.*"
                timeout: 60000
                optional: true
                label: "Sync Data answers"
- assertVisible:
    text: "No Data available for sync"
    label: "Nothing left to sync"
- takeScreenshot: artifacts/synced
- tapOn: "Close"
- evalScript: "${console.log('Sync Data - ' + output.syncLog + 'No Data available for sync')}"
