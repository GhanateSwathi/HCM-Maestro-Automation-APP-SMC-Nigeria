appId: ${HCM_APP_ID}
name: cdd-check-transaction
---
# Step 11, before accepting - on Incoming Transactions: open the first
# transaction for variant INDEX (0 or 1), let open-transaction.yaml check
# Stock Receipt Details (product, MRN, sender, quantity = the expected
# receipt), check the MRN against CDD_INCOMING_MRNS, then Back without
# accepting.
- runFlow:
    file: ../stock/accept-receipt/open-transaction.yaml
    env:
      INDEX: ${INDEX}
- runScript:
    file: registration.js
    env:
      ACTION: mrncheck
- takeScreenshot: artifacts/registration-cdd-receipt-${output.v.name}
- runFlow:
    when:
      true: ${output.reg.stockFailure}
    file: ../fail.yaml
    env:
      MESSAGE: ${output.reg.stockFailure}
    label: "The transaction is Prompt 6's dispatch"
- tapOn:
    text: "Back"
    label: "Back to Incoming Transactions"
- extendedWaitUntil:
    visible: "Incoming Transactions|MRN .*"
    timeout: 15000
    label: "Incoming Transactions is back"
# Back can leave the list scrolled, its title off screen (17 cards,
# 2026-10-26), so the list is known by its cards too - then scrolled to the
# top, so "the first card of a product" is the first in the list again.
- scrollUntilVisible:
    element:
      text: "Incoming Transactions"
    direction: UP
    timeout: 40000
    optional: true
    label: "Top of the list"
