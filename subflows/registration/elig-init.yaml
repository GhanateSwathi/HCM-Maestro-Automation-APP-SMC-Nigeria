appId: ${HCM_APP_ID}
name: elig-init
---
# Reads the eligibility household's test data (Prompt 19, the ELIG_* keys -
# see .env.example) before anything touches the device, and fails at once if
# any is missing or out of range. Generates the names: AutoEligHead<stamp>
# (also the search text) and AutoEligChild<n><stamp>.
- runScript:
    file: registration.js
    env:
      ACTION: init-elig
      TEST_USER: ${TEST_USER}
      VILLAGE: ${REGISTRATION_VILLAGE}
      LATITUDE: ${TEST_LATITUDE}
      LONGITUDE: ${TEST_LONGITUDE}
      MEMBERS: ${ELIG_HOUSEHOLD_MEMBERS}
      HEAD_YEARS: ${ELIG_HEAD_AGE_YEARS}
      HEAD_MONTHS: ${ELIG_HEAD_AGE_MONTHS}
      HEAD_GENDER: ${ELIG_HEAD_GENDER}
      MOBILE: ${HEAD_MOBILE}
      CHILD_1_MONTHS: ${ELIG_CHILD_1_AGE_MONTHS}
      CHILD_2_MONTHS: ${ELIG_CHILD_2_AGE_MONTHS}
      CHILD_3_MONTHS: ${ELIG_CHILD_3_AGE_MONTHS}
      CHILD_4_MONTHS: ${ELIG_CHILD_4_AGE_MONTHS}
      CHILD_GENDER: ${ELIG_CHILD_GENDER}
      FACILITY: ${ELIG_REFERRAL_FACILITY}
      VARIANT_1: ${PRODUCT_VARIANT_1}
      VARIANT_2: ${PRODUCT_VARIANT_2}
    label: "Read the Prompt 19 test data"
- runFlow:
    when:
      true: ${output.reg.failure}
    file: ../fail.yaml
    env:
      MESSAGE: ${output.reg.failure}
    label: "Prompt 19 test data is set in .env"
# TEST_USER is reported as the account under test, so it must be the one
# signing in. Only TEST_USER is named in the message.
- evalScript: "${output.userCheck = (String(TEST_USER).trim().toLowerCase() == String(HCM_CDD_USER_ID).trim().toLowerCase()) ? '' : 'TEST_USER ' + TEST_USER + ' is not the CDD user .env signs in with (HCM_CDD_USER_ID).'}"
- runFlow:
    when:
      true: ${output.userCheck}
    file: ../fail.yaml
    env:
      MESSAGE: ${output.userCheck}
    label: "TEST_USER is the account signing in"
