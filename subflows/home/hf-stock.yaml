appId: ${HCM_APP_ID}
name: home-hf-stock
---
# Takes the health facility stock user from a cold start to the home screen:
# the onboarding path (sign in, sync, Allow Permissions, first
# ADMIN_Health Facility option) plus Submit. Every flow that works from that
# user's home screen starts here. Leaves the facility chosen in
# output.dropdown.options[0] (also logged by the dropdown).
#
# In a chained run (KEEP_SESSION=true, scripts/run-chain.ps1) the previous
# flow's session is reused when the app is already signed in: keep-session.yaml
# decides, and sign-in (which clears the app), the facility and the data
# check are skipped as far as they are not needed.
- runFlow:
    file: keep-session.yaml
    env:
      HOME_SCREEN: "Stock Balance"
      BOUNDARY_SCREEN: "ADMIN_Health Facility.*"
- runFlow:
    when:
      true: ${output.session == 'fresh'}
    file: ../sign-in/hf-stock.yaml
- runFlow:
    when:
      true: ${output.session != 'home'}
    commands:
      - runFlow:
          file: ../dropdown/select-first-options.yaml
          env:
            FIELD: "ADMIN_Health Facility.*"
            COUNT: "1"
      - evalScript: ${console.log('Health Facility selected - ' + output.dropdown.options[0])}
      - tapOn:
          text: "Submit"
          label: "Submit the boundary selection"
      # Unlike the state user's, this Submit looks for records under the
      # chosen boundary first: "No data found!" (Go Back), "Data found!"
      # (Download, or Proceed Without Downloading per BOUNDARY_DATA_CHOICE),
      # or "Failed to check data in server" (Retry, then Proceed Without
      # Downloading) - all handled by boundary-data.yaml (Prompt 17), shared
      # with the CDD. AU-HFS-001 got "No data found!" on 2026-10-19 and, once
      # the facility had its own activity, "Data found!". Stock is fetched
      # later, by Download Stock Data.
      - runFlow:
          file: boundary-data.yaml
          env:
            HOME_SCREEN: "Stock Balance"
            ROLE: "Health Facility User"
- extendedWaitUntil:
    visible: "Stock Balance"
    timeout: 60000
    label: "On the home screen"

- runFlow:
    when:
      notVisible: "Manage Stock"
    commands:
      - scrollUntilVisible:
          element: "Manage Stock"
          direction: DOWN
          timeout: 10000
          optional: true
          label: "Scroll down looking for the Manage Stock card"
- runFlow:
    when:
      notVisible: "Manage Stock"
    commands:
      - takeScreenshot: artifacts/hf-manage-stock-card-missing
      - runFlow:
          file: ../fail.yaml
          env:
            MESSAGE: "Manage Stock card not displayed on home screen for Health Facility User."
          label: "Manage Stock card is displayed"
