appId: ${HCM_APP_ID}
name: case2a-cancel
---
# Cancel leaves the stock unaccepted - the state user's Case 2a, the health
# facility user's Test Case 4. Expects the Accept Confirmation popup for
# PRODUCT_VARIANT_1's transaction to be up. Runs before anything is
# accepted, so the cancel path is proven before anything is consumed. Ends on
# Incoming Transactions.
- tapOn:
    text: "Cancel"
    label: "Cancel - tap Cancel"
# Known to be on screen until Cancel, so this cannot pass vacuously.
- extendedWaitUntil:
    notVisible: "Accept Confirmation"
    timeout: 10000
    label: "Cancel - popup dismissed"
- assertVisible:
    text: "Stock Receipt Details"
    index: 0
    label: "Cancel - still on Stock Receipt Details"
- assertVisible:
    text: ${output.v.resource}
    rightOf: "Resource"
    above: "Material issue number"
    label: "Cancel - still the same product"
- assertVisible:
    text: "Accept Stock"
    label: "Cancel - Accept Stock still offered, so the stock was not accepted"
- takeScreenshot: artifacts/stock-accept-cancelled

# Back to the list. Not counted again: "Accept Stock" still offered on the
# same transaction is the proof nothing was accepted, and a whole-list count
# took 4-5 minutes on 17 cards (2026-10-26) - case2b-confirm's balance check
# would catch an acceptance anyway.
- tapOn:
    text: "Back"
    label: "Cancel - back to Incoming Transactions"
- extendedWaitUntil:
    visible: "Incoming Transactions|MRN .*"
    timeout: 15000
    label: "Cancel - Incoming Transactions is back"
# Back can leave the list scrolled, its title off screen (17 cards,
# 2026-10-26), so the list is known by its cards too - then scrolled to the
# top, so "the first card of a product" is the first in the list again.
- scrollUntilVisible:
    element:
      text: "Incoming Transactions"
    direction: UP
    timeout: 40000
    optional: true
    label: "Top of the list"
- evalScript: ${console.log(output.variants.cases.cancel + ' PASSED - Cancel returned to Stock Receipt Details with Accept Stock still offered; stock not accepted')}
