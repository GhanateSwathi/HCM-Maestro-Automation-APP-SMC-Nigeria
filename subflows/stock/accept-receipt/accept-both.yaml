appId: ${HCM_APP_ID}
name: accept-both
---
# Accepts one transaction per product variant, PRODUCT_VARIANT_1 first - the
# state user's Case 2b, the health facility user's Test Case 5, the CDD's
# Step 11. Expects Incoming Transactions, with both variants listed
# (check-variants.yaml). Ends on Incoming Transactions.
# IRREVERSIBLE: consumes two incoming transactions, so every run needs fresh
# incoming stock - one for each variant.
#
# No whole-list count between the steps (4-5 minutes each on 17 cards,
# 2026-10-26): each acceptance is proven by its banner and, for a real MRN,
# the MRN leaving the list (accept-transaction.yaml); the caller then checks
# each balance rose by what was received. A failure on the first variant
# stops the flow before the second is touched.

# Step 1 - the first variant.
- runFlow:
    file: accept-transaction.yaml
    env:
      INDEX: "0"
    label: "Step 1 - accept the first product variant"
- takeScreenshot: artifacts/stock-accept-step1-list

# Step 2 - the second variant; any failure now reads as a partial acceptance.
- runFlow:
    file: accept-transaction.yaml
    env:
      INDEX: "1"
    label: "Step 2 - accept the second product variant"
- takeScreenshot: artifacts/stock-accept-step2-list
