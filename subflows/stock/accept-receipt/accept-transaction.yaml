appId: ${HCM_APP_ID}
name: accept-transaction
---
# Accepts the first incoming transaction for product variant INDEX (0 or 1):
# Select -> Stock Receipt Details -> Accept Stock -> Confirm. Starts and ends
# on Incoming Transactions. IRREVERSIBLE: Confirm accepts the stock.
#
# What Confirm does, read off the app 2026-10-15 (QA to confirm as the
# expected outcome):
#   - a green "Stock accepted successfully" banner, gone after a few seconds
#   - back to the Manage Stock screen
#   - the transaction leaves Incoming Transactions; the rest renumber
#     ("MRN null_2" became "MRN null_1")
#   - the product's Stock Balance on home rises by the quantity (checked by
#     the caller at the end)
#
# Any failure stops the flow, so the second variant is never tried after the
# first fails; once the first is accepted, a failure on the second reads
#   Partial acceptance: SPAQ1 accepted, SPAQ2 failed – <reason>
- runFlow:
    file: open-transaction.yaml
    env:
      INDEX: ${INDEX}
- runFlow: open-accept-confirmation.yaml
- tapOn:
    text: "Confirm"
    label: "Accept - tap Confirm (accepts this transaction's stock)"

# The banner lasts a few seconds; record it the moment it shows.
- evalScript: ${output.v.banner = false}
- extendedWaitUntil:
    visible: "Stock accepted successfully"
    timeout: 15000
    optional: true
    label: "Accept - success banner"
- runFlow:
    when:
      visible: "Stock accepted successfully"
    commands:
      - evalScript: ${output.v.banner = true}
      - takeScreenshot: artifacts/stock-accepted-${output.v.name}
- extendedWaitUntil:
    visible: "Record Stock Receipt"
    timeout: 15000
    optional: true
    label: "Accept - back on Manage Stock"
- runFlow:
    when:
      notVisible: "Record Stock Receipt"
    file: ../../fail.yaml
    env:
      MESSAGE: "${output.v.prefix + 'after Confirm the app did not return to Manage Stock.'}"
    label: "Accept - back on Manage Stock"
- runFlow:
    when:
      true: ${!output.v.banner}
    file: ../../fail.yaml
    env:
      MESSAGE: "${output.v.prefix + 'no \"Stock accepted successfully\" banner after Confirm.'}"
    label: "Accept - success banner shown"

# Back to the list, for the next step. Not counted: a whole-list count took
# 4-5 minutes on 17 cards (2026-10-26). The acceptance is proven by the banner
# above and, at the end, by the balance rising by the quantity received
# (case2b-confirm, hf-receipt's Test Case 6, the CDD's Step 11). A real MRN is
# also looked for in the whole list: it must be gone - after one Download Stock
# Data, as on 2026-10-26 an accepted transaction stayed listed until then. A
# placeholder ("MRN null_0") renumbers and cannot be looked for.
- tapOn:
    text: "Record Stock Receipt"
    label: "Accept - reopen Record Stock Receipt"
- extendedWaitUntil:
    visible: "Incoming Transactions"
    timeout: 15000
    label: "Accept - Incoming Transactions is back"
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      true: ${!output.txn.mrnMissing}
    commands:
      - scrollUntilVisible:
          element:
            text: ${output.txn.labelPattern}
          direction: DOWN
          timeout: 30000
          optional: true
          label: "Accept - look for the accepted MRN in the list"
      - runFlow:
          when:
            visible:
              text: ${output.txn.labelPattern}
          commands:
            - evalScript: "${console.log('NOTE - ' + output.txn.mrnLabel + ' is still listed after Confirm - Download Stock Data and look again')}"
            - runFlow: ../back-to-home.yaml
            - runFlow: ../download-stock-data.yaml
            - runFlow: ../open-incoming-transactions.yaml
            - scrollUntilVisible:
                element:
                  text: ${output.txn.labelPattern}
                direction: DOWN
                timeout: 30000
                optional: true
                label: "Accept - look for the accepted MRN again"
            - runFlow:
                when:
                  visible:
                    text: ${output.txn.labelPattern}
                file: ../../fail.yaml
                env:
                  MESSAGE: "${output.v.prefix + output.txn.mrnLabel + ' is still listed in Incoming Transactions after Confirm and Download Stock Data.'}"
                label: "Accept - the accepted MRN left the incoming list"
      - scrollUntilVisible:
          element:
            text: "Incoming Transactions"
          direction: UP
          timeout: 40000
          optional: true
          label: "Top of the list"
- runScript:
    file: variants.js
    env:
      ACTION: accepted
    label: "Record the accepted variant"
