appId: ${HCM_APP_ID}
name: hf-tc3-variant
---
# Test Case 3 for variant INDEX (0 or 1): open its first transaction,
# check Stock Receipt Details (open-transaction.yaml fails on a different
# product, MRN, sender, or a quantity other than the one dispatched -
#   Quantity mismatch for <variant>: dispatched <X>, shown as received <Y>.
# ), then back to Incoming Transactions without accepting.
- runFlow:
    file: ../accept-receipt/open-transaction.yaml
    env:
      INDEX: ${INDEX}
- takeScreenshot: artifacts/hf-tc3-details-${output.v.name}
- evalScript: "${console.log('Test Case 3 - ' + output.v.name + ' transaction ' + output.txn.mrnLabel + ' from ' + output.txn.sender + ': received ' + output.variants.received[output.v.index] + ', dispatched ' + output.variants.expected[output.v.index])}"
- tapOn:
    text: "Back"
    label: "Test Case 3 - back to Incoming Transactions"
- extendedWaitUntil:
    visible: "Incoming Transactions|MRN .*"
    timeout: 15000
    label: "Test Case 3 - Incoming Transactions is back"
# Back can leave the list scrolled, its title off screen (17 cards,
# 2026-10-26), so the list is known by its cards too - then scrolled to the
# top, so "the first card of a product" is the first in the list again.
- scrollUntilVisible:
    element:
      text: "Incoming Transactions"
    direction: UP
    timeout: 40000
    optional: true
    label: "Top of the list"
