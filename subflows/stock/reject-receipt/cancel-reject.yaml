appId: ${HCM_APP_ID}
name: reject-cancel
---
# Test Case 3 - Cancel leaves the stock pending. Expects the reject popup up
# for PRODUCT_VARIANT_1's transaction (open-reject.yaml). Runs before anything
# is rejected, so the cancel path is proven before anything is consumed. Ends
# on Incoming Transactions with both variants' counts unchanged.
- tapOn:
    text: "Cancel"
    label: "Test Case 3 - tap Cancel"
# output.rej.closeCheck is on screen until Cancel, so this cannot pass early.
- extendedWaitUntil:
    notVisible: ${output.rej.closeCheck}
    timeout: 10000
    label: "Test Case 3 - popup dismissed"
- evalScript: ${output.rej.open = false}
- assertVisible:
    text: "Stock Receipt Details"
    index: 0
    label: "Test Case 3 - still on Stock Receipt Details"
- assertVisible:
    text: ${output.v.resource}
    rightOf: "Resource"
    above: "Material issue number"
    label: "Test Case 3 - still the same product"
- assertVisible:
    text: "Accept Stock"
    label: "Test Case 3 - Accept Stock still offered"
- assertVisible:
    text: "Reject"
    label: "Test Case 3 - Reject still offered, so the stock was not rejected"
- takeScreenshot: artifacts/stock-reject-cancelled

- tapOn:
    text: "Back"
    label: "Test Case 3 - back to Incoming Transactions"
- extendedWaitUntil:
    visible: "Incoming Transactions|MRN .*"
    timeout: 15000
    label: "Test Case 3 - Incoming Transactions is back"
# Back can leave the list scrolled, its title off screen (17 cards,
# 2026-10-26), so the list is known by its cards too - then scrolled to the
# top, so "the first card of a product" is the first in the list again.
- scrollUntilVisible:
    element:
      text: "Incoming Transactions"
    direction: UP
    timeout: 40000
    optional: true
    label: "Top of the list"
- waitForAnimationToEnd:
    timeout: 3000
# Not counted again: Reject still offered on the same transaction is the
# proof nothing was rejected, and a whole-list count took 4-5 minutes on 17
# cards (2026-10-26). Test Case 6's count after both rejections would show a
# transaction lost here.
- evalScript: ${output.rej.cancel = 'popup closed, still on Stock Receipt Details with Accept Stock and Reject offered'}
- evalScript: ${console.log('Test Case 3 PASSED - Cancel returned to Stock Receipt Details with Accept Stock and Reject still offered; stock not rejected')}
